[build-system]
# setuptools: build backend for `pip install -e .` (build-time only, not shipped).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Voice-first personal assistant (Phase 1: text core)"
requires-python = ">=3.11"
dependencies = [
    # openai: official SDK for the LLM adapter (Responses API); imported only in src/jarvis/llm/.
    "openai>=3.19,<4",
    # python-dotenv: reads .env into config (dotenv_values); standard, well-tested .env parsing.
    "python-dotenv>=1.2,<2",
    # faster-whisper: local CPU speech-to-text; imported only in src/jarvis/voice/stt/.
    "faster-whisper>=1.2,<2",
    # sounddevice: microphone capture and PCM playback (PortAudio).
    "sounddevice>=0.5,<1",
    # numpy: audio buffers passed between recorder, STT, and playback.
    "numpy>=2",
    # pyttsx3: free local Windows TTS (SAPI5); imported only in src/jarvis/voice/tts/.
    "pyttsx3>=2.99,<3",
    # pynput: global push-to-talk hotkey (only the configured key is inspected).
    "pynput>=1.8,<2",
    # psutil: process RAM measurement for the STT benchmark and voice-turn metrics.
    "psutil>=7,<8",
    # windows-toasts: desktop notifications for due reminders (Apache-2.0; only 5 WinRT packages);
    # imported only in src/jarvis/integrations/notify.py.
    "windows-toasts>=1.3,<2",
    # pypdf: text extraction from PDFs for file search/reading (BSD-3-Clause, pure Python, no native DLLs);
    # imported only in src/jarvis/tools/file_text.py.
    "pypdf>=6.19,<7",
]

[project.optional-dependencies]
dev = [
    # pytest: test runner for tests/.
    "pytest",
]

[project.scripts]
# Entry point is created in step 4 (src/jarvis/cli.py).
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
